name: flutter_cake_shop_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2 # ใช้ฟอนต์ฟรีจาก fonts.google.com
  font_awesome_flutter: ^10.11.0 # ใช้ไอคอนจาก fontawesome.com
  url_launcher: ^6.3.2 # เปิดเบอร์โทร/ลิงก์เว็บภายนอก
  flutter_map: ^8.2.2 # แสดงแผนที่จาก OpenStreetMap
  latlong2: ^0.9.1 # จัดการพิกัด latitude/longitude
  carousel_slider: ^5.1.1 # สไลด์รูปภาพหน้า list

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

icons_launcher:
  image_path: "assets/icon/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
